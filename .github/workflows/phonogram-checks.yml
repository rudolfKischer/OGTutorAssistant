name: Phonogram foundation
on:
  pull_request:
    branches: [issue-10-phonograms]
  workflow_dispatch:
jobs:
  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/data_bucket.py fetch
      - run: python -B -m unittest discover -s tests -v
